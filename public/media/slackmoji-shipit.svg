<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Shipit squirrel">
  <!-- The app's own art, not a workspace's upload. The tail is the whole
       silhouette: at 36px a rocket alone is indistinguishable from 🚀, which
       this list also carries. Transform and opacity only — a picker draws ten
       of these at once. -->
  <style>
    .hop { transform-origin: 32px 46px; animation: hop 2.4s ease-in-out infinite; }
    @keyframes hop { 0%, 100% { transform: translateY(1.5px); } 50% { transform: translateY(-2px); } }
    @media (prefers-reduced-motion: reduce) { .hop { animation: none; } }
  </style>
  <g class="hop">
    <!-- Tail: the recognisable part, so it is the biggest shape. -->
    <path d="M20 54c-11-3-15-16-9-26 4-7 12-9 16-5 3 3 2 7-1 8-4 1-7 4-7 9 0 6 4 10 9 11z"
          fill="#B4794C"/>
    <path d="M21 49c-6-3-8-11-4-17 2-4 6-6 8-4 2 1 1 4-1 5-4 2-6 6-5 11z" fill="#8A5A34"/>
    <!-- Body and head. -->
    <ellipse cx="37" cy="45" rx="11" ry="12" fill="#C08A57"/>
    <ellipse cx="39" cy="47" rx="6" ry="8" fill="#E8C49B"/>
    <circle cx="41" cy="26" r="9" fill="#C08A57"/>
    <path d="M35 18c-2-4 0-7 3-6 2 1 2 4 1 6z" fill="#C08A57"/>
    <circle cx="44" cy="25" r="2" fill="#17181A"/>
    <circle cx="49" cy="27" r="1.6" fill="#17181A"/>
  </g>
</svg>
